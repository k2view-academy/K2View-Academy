<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="From conversations to the dashboard" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs>
  <rect width="780" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">From conversations to the dashboard</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6169">Analysis runs on demand or on your schedule (RunAnalyze, analyzer pipelines)</text>
  <path d="M224 112H254" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M494 112H524" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M494 232H580V152" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M680 152V312" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M524 344H494" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M254 344H224" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M124 392V428H254" fill="none" stroke="#9aa0a6" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <rect x="24" y="72" width="200" height="80" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="36" y="94" font-weight="600" fill="#1f2328">Agent sessions</text>
  <text x="36" y="112" font-size="11.5" fill="#5b6169">Every turn recorded:</text>
  <text x="36" y="128" font-size="11.5" fill="#5b6169">messages, tools, tokens,</text>
  <text x="36" y="144" font-size="11.5" fill="#5b6169">feedback</text>
  <rect x="254" y="72" width="240" height="80" rx="8" fill="#f0f0ee" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="266" y="94" font-weight="600" fill="#1f2328">ACTVSESSION + INSTANCES</text>
  <text x="266" y="112" font-size="11.5" fill="#5b6169">Session status OPEN,</text>
  <text x="266" y="128" font-size="11.5" fill="#5b6169">agent, Data Product,</text>
  <text x="266" y="144" font-size="11.5" fill="#5b6169">customer instances</text>
  <rect x="524" y="72" width="232" height="80" rx="8" fill="#e8eefb" stroke="#2f6fdf" stroke-width="1.75"/>
  <text x="536" y="94" font-weight="600" fill="#1f2328">Analysis (LLMChatAnalyze)</text>
  <text x="536" y="112" font-size="11.5" fill="#5b6169">Summary + classification</text>
  <text x="536" y="128" font-size="11.5" fill="#5b6169">of each signal by an LLM</text>
  <rect x="254" y="184" width="240" height="96" rx="8" fill="#f0f0ee" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="266" y="206" font-weight="600" fill="#1f2328">Signals</text>
  <text x="266" y="224" font-size="11.5" fill="#5b6169">Core: Resolution Status,</text>
  <text x="266" y="240" font-size="11.5" fill="#5b6169">Sentiment, Topic</text>
  <text x="266" y="256" font-size="11.5" fill="#5b6169">+ the agent&#x27;s</text>
  <text x="266" y="272" font-size="11.5" fill="#5b6169">Observation/signals.yaml</text>
  <rect x="524" y="312" width="232" height="64" rx="8" fill="#f0f0ee" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="536" y="334" font-weight="600" fill="#1f2328">INSIGHTS</text>
  <text x="536" y="352" font-size="11.5" fill="#5b6169">tag_name / tag_value per session</text>
  <text x="536" y="368" font-size="11.5" fill="#5b6169">+ feedback counters</text>
  <rect x="254" y="312" width="240" height="64" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="266" y="334" font-weight="600" fill="#1f2328">Widgets</text>
  <text x="266" y="352" font-size="11.5" fill="#5b6169">widgets.csv (All Agents)</text>
  <text x="266" y="368" font-size="11.5" fill="#5b6169">or the agent&#x27;s widgets.yaml</text>
  <rect x="24" y="296" width="200" height="96" rx="8" fill="#e8eefb" stroke="#2f6fdf" stroke-width="1.75"/>
  <text x="36" y="318" font-weight="600" fill="#1f2328">Observation dashboard</text>
  <text x="36" y="336" font-size="11.5" fill="#5b6169">Agent selector, KPIs, charts,</text>
  <text x="36" y="352" font-size="11.5" fill="#5b6169">Conversation Details</text>
  <text x="36" y="368" font-size="11.5" fill="#5b6169">-&gt; conversation review</text>
  <rect x="254" y="408" width="502" height="44" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="505.0" y="434.0" text-anchor="middle" font-weight="600" fill="#1f2328">Export with snap -&gt; Studio Preview Import -&gt; Save as test case</text>
</svg>
