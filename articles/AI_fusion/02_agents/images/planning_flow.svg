<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="Plan-then-execute" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs>
  <rect width="780" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Plan-then-execute</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6169">planning: on — the planner follows a written procedure (example: the banking demo)</text>
  <path d="M224 104H254" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M494 104H524" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M640 136V168" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M640 232V264" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M524 296H494" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M374 328V360" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="24" y="72" width="200" height="64" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="36" y="94" font-weight="600" fill="#1f2328">Multi-step request</text>
  <text x="36" y="112" font-size="11.5" fill="#5b6169">e.g. &quot;lower my card APR&quot;</text>
  <rect x="254" y="72" width="240" height="64" rx="8" fill="#e8eefb" stroke="#2f6fdf" stroke-width="1.75"/>
  <text x="266" y="94" font-weight="600" fill="#1f2328">enter_plan_mode</text>
  <text x="266" y="112" font-size="11.5" fill="#5b6169">The main agent hands the</text>
  <text x="266" y="128" font-size="11.5" fill="#5b6169">refined request to the planner</text>
  <rect x="524" y="72" width="232" height="64" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="536" y="94" font-weight="600" fill="#1f2328">Planner sub-agent</text>
  <text x="536" y="112" font-size="11.5" fill="#5b6169">find_procedures, load_procedure,</text>
  <text x="536" y="128" font-size="11.5" fill="#5b6169">plan</text>
  <rect x="524" y="168" width="232" height="64" rx="8" fill="#f0f0ee" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="536" y="190" font-weight="600" fill="#1f2328">References/Procedures</text>
  <text x="536" y="208" font-size="11.5" fill="#5b6169">credit-card-apr-reduction.md</text>
  <text x="536" y="224" font-size="11.5" fill="#5b6169">credit-card-limit-change.md ...</text>
  <rect x="524" y="264" width="232" height="64" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="536" y="286" font-weight="600" fill="#1f2328">Approval (approve: true)</text>
  <text x="536" y="304" font-size="11.5" fill="#5b6169">ask_user shows the plan;</text>
  <text x="536" y="320" font-size="11.5" fill="#5b6169">revise until approved</text>
  <rect x="254" y="264" width="240" height="64" rx="8" fill="#e8eefb" stroke="#2f6fdf" stroke-width="1.75"/>
  <text x="266" y="286" font-weight="600" fill="#1f2328">To-do list</text>
  <text x="266" y="304" font-size="11.5" fill="#5b6169">One to-do per step, shown live</text>
  <text x="266" y="320" font-size="11.5" fill="#5b6169">pending, in progress, done</text>
  <rect x="254" y="360" width="240" height="84" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="266" y="382" font-weight="600" fill="#1f2328">Main agent executes</text>
  <text x="266" y="400" font-size="11.5" fill="#5b6169">In order; task to a sub-agent</text>
  <text x="266" y="416" font-size="11.5" fill="#5b6169">or its own tool per to-do;</text>
  <text x="266" y="432" font-size="11.5" fill="#5b6169">resumes from the first pending</text>
  <rect x="24" y="264" width="200" height="180" rx="8" fill="#f0f0ee" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="36" y="286" font-weight="600" fill="#1f2328">Rules added</text>
  <text x="36" y="304" font-size="11.5" fill="#5b6169">automatically to the prompt:</text>
  <text x="36" y="320" font-size="11.5" fill="#5b6169"></text>
  <text x="36" y="336" font-size="11.5" fill="#5b6169">- plan when &gt; 1 sub-agent</text>
  <text x="36" y="352" font-size="11.5" fill="#5b6169">  or &gt; 2 tool calls</text>
  <text x="36" y="368" font-size="11.5" fill="#5b6169">- do not re-plan</text>
  <text x="36" y="384" font-size="11.5" fill="#5b6169">- ask, then stop the turn</text>
  <text x="36" y="400" font-size="11.5" fill="#5b6169">- skip the rest if a</text>
  <text x="36" y="416" font-size="11.5" fill="#5b6169">  procedure gate fails</text>
</svg>
