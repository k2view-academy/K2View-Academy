<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 616" width="780" height="616" role="img" aria-label="Anatomy of an agent" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs>
  <rect width="780" height="616" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Anatomy of an agent</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6169">What the main agent can reach in a turn. Sub-agent names are examples from the banking demo.</text>
  <path d="M224 120H250" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M556 120H530" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M460 168V206" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M300 168V186H12V420H24" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="24" y="72" width="200" height="96" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="36" y="94" font-weight="600" fill="#1f2328">Skills</text>
  <text x="36" y="112" font-size="11.5" fill="#5b6169">Markdown loaded on demand</text>
  <text x="36" y="128" font-size="11.5" fill="#5b6169">or auto_load; tables: adds</text>
  <text x="36" y="144" font-size="11.5" fill="#5b6169">the live LU schema</text>
  <rect x="250" y="72" width="280" height="96" rx="8" fill="#e8eefb" stroke="#2f6fdf" stroke-width="1.75"/>
  <text x="262" y="94" font-weight="600" fill="#1f2328">Main agent  (agent.yaml)</text>
  <text x="262" y="112" font-size="11.5" fill="#5b6169">system_prompt, response_prompt,</text>
  <text x="262" y="128" font-size="11.5" fill="#5b6169">constraints, settings, hooks</text>
  <text x="262" y="144" font-size="11.5" fill="#5b6169">planning, search_reference, widget</text>
  <rect x="556" y="72" width="200" height="96" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="568" y="94" font-weight="600" fill="#1f2328">Reference packs</text>
  <text x="568" y="112" font-size="11.5" fill="#5b6169">References/KB, Procedures</text>
  <text x="568" y="128" font-size="11.5" fill="#5b6169">search_references (cited)</text>
  <text x="568" y="144" font-size="11.5" fill="#5b6169">Procedures guide planning</text>
  <text x="468" y="192" text-anchor="start" font-size="11.5" fill="#5b6169">calls</text>
  <rect x="24" y="206" width="732" height="120" rx="10" fill="none" stroke="#9aa0a6" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="38" y="228" font-weight="600" fill="#1f2328">Tools the LLM can call</text>
  <rect x="40" y="240" width="162" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="52" y="262" font-weight="600" fill="#1f2328">query</text>
  <text x="52" y="280" font-size="11.5" fill="#5b6169">SQL on the customer&#x27;s</text>
  <text x="52" y="296" font-size="11.5" fill="#5b6169">micro-DB (read data)</text>
  <rect x="218" y="240" width="162" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="230" y="262" font-weight="600" fill="#1f2328">Flow tools</text>
  <text x="230" y="280" font-size="11.5" fill="#5b6169">Broadway flows</text>
  <text x="230" y="296" font-size="11.5" fill="#5b6169">(business operations)</text>
  <rect x="396" y="240" width="162" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="408" y="262" font-weight="600" fill="#1f2328">MCP tools</text>
  <text x="408" y="280" font-size="11.5" fill="#5b6169">MCP__&lt;iface&gt;__&lt;tool&gt;</text>
  <rect x="574" y="240" width="166" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="586" y="262" font-weight="600" fill="#1f2328">Platform tools</text>
  <text x="586" y="280" font-size="11.5" fill="#5b6169">ask_user, current_datetime,</text>
  <text x="586" y="296" font-size="11.5" fill="#5b6169">build_widget, to-dos</text>
  <text x="30" y="180" text-anchor="start" font-size="1" font-weight="400" fill="#5b6169"></text>
  <rect x="24" y="346" width="732" height="148" rx="10" fill="none" stroke="#9aa0a6" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="38" y="368" font-weight="600" fill="#1f2328">Sub-agents  (Subagents/*.yaml or linked agents; example: the banking demo)</text>
  <text x="38" y="386" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6169">task: the result returns to the parent  ·  delegate: the sub-agent answers the user</text>
  <rect x="40" y="400" width="222" height="80" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="52" y="422" font-weight="600" fill="#1f2328">credit-card</text>
  <text x="52" y="440" font-size="11.5" fill="#5b6169">Own prompt, constraints, flow</text>
  <text x="52" y="456" font-size="11.5" fill="#5b6169">tools and schema skill</text>
  <text x="52" y="472" font-size="11.5" fill="#5b6169">step_start: LoadCustomerScope</text>
  <rect x="278" y="400" width="222" height="80" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="290" y="422" font-weight="600" fill="#1f2328">dda</text>
  <text x="290" y="440" font-size="11.5" fill="#5b6169">Accounts and transactions</text>
  <text x="290" y="456" font-size="11.5" fill="#5b6169">query + dda-schema</text>
  <rect x="516" y="400" width="224" height="80" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="528" y="422" font-weight="600" fill="#1f2328">loan, payroll, tax, crm ...</text>
  <text x="528" y="440" font-size="11.5" fill="#5b6169">Each specialist sees only</text>
  <text x="528" y="456" font-size="11.5" fill="#5b6169">its own tools and skills</text>
  <rect x="24" y="512" width="732" height="88" rx="8" fill="#f0f0ee" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="36" y="534" font-weight="600" fill="#1f2328">Every agent and sub-agent</text>
  <text x="36" y="552" font-size="11.5" fill="#5b6169">Runs its own hooks (step_start, pre/post_tool_call, step_end, on_error) and its own reasoning loop</text>
  <text x="36" y="568" font-size="11.5" fill="#5b6169">Receives the trusted agent inputs (initParams, e.g. customerId) — read them with AgentInitParams</text>
  <text x="36" y="584" font-size="11.5" fill="#5b6169">Is recorded in the session trace as its own execution, nested under the tool call that started it</text>
</svg>
